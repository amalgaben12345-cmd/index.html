<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المصطلحات التشريحية للجسم</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 900px;
            text-align: center;
        }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.6s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1, h2, h3 { color: var(--primary); margin-top: 0; }
        p.subtitle { color: #7f8c8d; font-size: 1.1em; margin-bottom: 30px; }

        button.main-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        button.main-btn:hover { background-color: #2980b9; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4); }

        /* منطقة اللعبة */
        #gameWrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #gameArea {
            position: relative;
            display: inline-block;
            border: 3px solid #ddd;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        #bodyImg {
            display: block;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .drop-zone {
            position: absolute;
            width: 85px; /* عرض مناسب للمصطلحات الإنجليزية */
            height: 26px;
            border: 2px dashed #b2bec3;
            background: rgba(255,255,255,0.85);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #2d3436;
            z-index: 10;
            transition: all 0.2s;
            transform: translate(-50%, -50%); /* للتمركز الدقيق حول النقطة */
        }
        
        /* إخفاء نقاط الدوران إذا أردت تصميم أنظف (اختياري) */
        /* .drop-zone::after { content: ''; position: absolute; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; } */

        .drop-zone.hover { border-color: var(--accent); background: rgba(52, 152, 219, 0.1); }

        /* بنك الكلمات */
        #wordsSection {
            width: 100%;
            background: #fdfdfd;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        #wordsBank {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            min-height: 80px;
        }

        .word-item {
            padding: 9px 18px;
            background: white;
            color: var(--primary);
            border: 1px solid #d1d8e0;
            border-radius: 25px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
        }

        .word-item:active { cursor: grabbing; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .word-item.dragging { opacity: 0.5; }

        /* حالات النتيجة */
        .drop-zone.placed { border-style: solid; border-color: #ddd; }
        .correct { background-color: var(--success) !important; color: white; border-color: #2ecc71 !important; box-shadow: 0 0 10px rgba(39, 174, 96, 0.4); }
        .wrong { background-color: var(--danger) !important; color: white; border-color: #c0392b !important; box-shadow: 0 0 10px rgba(231, 76, 60, 0.4); }

        #gameHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        #timer { font-size: 1.2em; font-weight: bold; color: var(--primary); }
        #partsCounter { font-size: 1.1em; color: #7f8c8d; }

        #resultPanel {
            margin-top: 25px;
            padding: 20px;
            background: rgba(44, 62, 80, 0.03);
            border-radius: 12px;
            display: none;
        }
        #resultText { font-size: 1.3em; font-weight: 700; margin-bottom: 15px; }
        .score-correct { color: var(--success); }
        .score-wrong { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    
    <div id="startScreen" class="screen active">
        <h1>🦴 تحدي المصطلحات التشريحية</h1>
        <p class="subtitle">هل تعرف أماكن جميع الأجزاء الرئيسية لجسم الإنسان؟ جرب الآن!</p>
        <button class="main-btn" onclick="goToSelect()">إبدأ التحدي</button>
    </div>

    <div id="selectScreen" class="screen">
        <h2>اختر اتجاه الجسم</h2>
        <p class="subtitle">هل تريد التدرب على الجهة الأمامية أم الخلفية؟</p>
        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <button class="main-btn" style="background-color: #f39c12;" onclick="startGame('front')">
                <span style="font-size: 1.3em;">🧍‍♂️</span> الجهة الأمامية (Anterior)
            </button>
            <button class="main-btn" style="background-color: #8e44ad;" onclick="startGame('back')">
                <span style="font-size: 1.3em;">🚶‍♂️</span> الجهة الخلفية (Posterior)
            </button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div id="gameHeader">
            <div id="timer">⏱️ الوقت: 00:00</div>
            <div id="partsCounter">العناصر: <span id="placedCount">0</span> / <span id="totalCount">0</span></div>
        </div>
        
        <div id="gameWrapper">
            <div id="gameArea">
                <img id="bodyImg" src="" alt="Body Diagram">
                <div id="zonesContainer"></div>
            </div>

            <div id="wordsSection">
                <h3>اسحب الكلمات إلى أماكنها:</h3>
                <div id="wordsBank"></div>
            </div>

            <div id="resultPanel">
                <div id="resultText"></div>
                <button class="main-btn" style="background-color: #7f8c8d; padding: 10px 25px; font-size: 1em;" onclick="location.reload()">إعادة المحاولة 🔄</button>
            </div>

            <div style="margin-top: 10px; width: 100%; display: flex; justify-content: center;">
                <button id="finishBtn" class="main-btn" style="background-color: #2ecc71; width: 200px;" onclick="finishGame()">إنهاء ومراجعة ✔️</button>
            </div>
        </div>
    </div>

</div>

<script>
    // بيانات الأماكن مضبوطة بدقة بناءً على الصورة الأصلية
    const data = {
        front: {
            img: "body_front.jpg", 
            width: 450, // العرض الافتراضي للصورة للمعالجة
            parts: [
                // رأس ورقبة
                { label: "Nasal", top: "18%", left: "41.5%" },
                { label: "Oral", top: "21.5%", left: "41.5%" },
                { label: "Cervical", top: "24.5%", left: "41.5%" },
                { label: "Orbital", top: "18%", left: "58.5%" },
                { label: "Buccal", top: "21.5%", left: "58.5%" },
                // جذع وكتف
                { label: "Acromial", top: "27.5%", left: "31%" },
                { label: "Axillary", top: "31%", left: "62.5%" },
                { label: "Sternal", top: "27.5%", left: "53%" },
                { label: "Thoracic", top: "34%", left: "37%" },
                { label: "Abdominal", top: "45%", left: "38%" },
                { label: "Umbilical", top: "49%", left: "38%" },
                { label: "Pelvic", top: "50%", left: "64%" },
                // ذراع ويد
                { label: "Brachial", top: "37%", left: "33%" },
                { label: "Antecubital", top: "41.5%", left: "32.5%" },
                { label: "Carpal", top: "56%", left: "28.5%" },
                { label: "Digital", top: "60%", left: "28.5%" },
                // حوض ورجل
                { label: "Coxal", top: "60.5%", left: "56%" },
                { label: "Inguinal", top: "64%", left: "56%" },
                { label: "Pubic", top: "65.5%", left: "39%" },
                { label: "Femoral", top: "71%", left: "59%" },
                { label: "Patellar", top: "73%", left: "38%" },
                { label: "Fibular", top: "76%", left: "60%" },
                { label: "Crural", top: "81%", left: "36.5%" },
                { label: "Tarsal", top: "91.5%", left: "33.5%" }
            ]
        },
        back: {
            img: "body_back.jpg",
            width: 450,
            parts: [
                // رأس ورقبة
                { label: "Cephalic", top: "19%", left: "29.5%" },
                { label: "Occipital", top: "17%", left: "67.5%" },
                // ظهر وكتف
                { label: "Deltoid", top: "26.5%", left: "69.5%" },
                { label: "Scapular", top: "33.5%", left: "63%" },
                { label: "Vertebral", top: "37.5%", left: "63%" },
                { label: "Thoracic", top: "36%", left: "31.5%" },
                { label: "Lumbar", top: "47.5%", left: "63.5%" },
                { label: "Sacral", top: "50.5%", left: "63.5%" },
                // ذراع خلفي
                { label: "Olecranal", top: "41.5%", left: "63%" },
                // حوض ورجل خلفية
                { label: "Gluteal", top: "61%", left: "68%" },
                { label: "Femoral", top: "64%", left: "33%" },
                { label: "Popliteal", top: "71.5%", left: "70.5%" },
                { label: "Crural", top: "80%", left: "33%" },
                { label: "Sural", top: "80%", left: "70%" },
                { label: "Calcaneal", top: "91%", left: "70%" },
                { label: "Plantar", top: "94%", left: "70%" }
            ]
        }
    };

    let seconds = 0;
    let timerInterval;
    let currentMode = '';
    let totalParts = 0;

    function goToSelect() {
        showScreen('selectScreen');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame(mode) {
        currentMode = mode;
        const config = data[mode];
        const imgElement = document.getElementById('bodyImg');
        imgElement.src = config.img;
        
        // إخفاء زر الإنهاء والنتيجة لحين تحميل الصورة
        document.getElementById('finishBtn').style.display = 'none';
        document.getElementById('resultPanel').style.display = 'none';
        
        imgElement.onload = () => {
            showScreen('gameScreen');
            setupGame(config);
            startTimer();
            document.getElementById('finishBtn').style.display = 'block';
        };
    }

    function setupGame(config) {
        const zonesContainer = document.getElementById('zonesContainer');
        const wordsBank = document.getElementById('wordsBank');
        zonesContainer.innerHTML = '';
        wordsBank.innerHTML = '';
        
        totalParts = config.parts.length;
        document.getElementById('totalCount').innerText = totalParts;
        updatePlacedCount();

        // إنشاء مناطق الإسقاط
        config.parts.forEach(part => {
            const zone = document.createElement('div');
            zone.className = 'drop-zone';
            zone.style.top = part.top;
            zone.style.left = part.left;
            zone.dataset.answer = part.label;
            
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('hover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('hover'));
            zone.addEventListener('drop', handleDrop);
            
            zonesContainer.appendChild(zone);
        });

        // إنشاء الكلمات مبعثرة (Shuffled)
        const shuffledWords = [...config.parts].sort(() => Math.random() - 0.5);
        shuffledWords.forEach(part => {
            const word = document.createElement('div');
            word.className = 'word-item';
            word.innerText = part.label;
            word.draggable = true;
            
            word.addEventListener('dragstart', e => {
                e.dataTransfer.setData("text/plain", e.target.innerText);
                e.dataTransfer.setData("sourceId", e.target.id = "drag-" + Math.random());
                e.target.classList.add('dragging');
            });
            word.addEventListener('dragend', e => e.target.classList.remove('dragging'));
            
            wordsBank.appendChild(word);
        });
    }

    function handleDrop(e) {
        e.preventDefault();
        const zone = e.target.closest('.drop-zone');
        if (!zone) return;
        
        zone.classList.remove('hover');
        const dataText = e.dataTransfer.getData("text/plain");
        const sourceId = e.dataTransfer.getData("sourceId");
        
        // إذا كان هناك كلمة قديمة في المربع، نعيدها للبنك
        if (zone.innerText !== "") {
            returnWordToBank(zone.innerText);
        }
        
        zone.innerText = dataText;
        zone.classList.add('placed');
        
        // حذف الكلمة المسحوبة من البنك
        const draggedElement = document.getElementById(sourceId);
        if (draggedElement) draggedElement.remove();
        
        updatePlacedCount();
    }
    
    function returnWordToBank(wordText) {
        const word = document.createElement('div');
        word.className = 'word-item';
        word.innerText = wordText;
        word.draggable = true;
        word.addEventListener('dragstart', e => {
            e.dataTransfer.setData("text/plain", e.target.innerText);
            e.dataTransfer.setData("sourceId", e.target.id = "drag-" + Math.random());
        });
        document.getElementById('wordsBank').appendChild(word);
    }
    
    function updatePlacedCount() {
        const placed = document.querySelectorAll('.drop-zone.placed').length;
        document.getElementById('placedCount').innerText = placed;
    }

    function startTimer() {
        clearInterval(timerInterval);
        seconds = 0;
        document.getElementById('timer').innerText = `⏱️ الوقت: 00:00`;
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `⏱️ الوقت: ${mins}:${secs}`;
        }, 1000);
    }

    function finishGame() {
        clearInterval(timerInterval);
        let correctCount = 0;
        const zones = document.querySelectorAll('.drop-zone');
        
        // إخفاء بنك الكلمات وزر الإنهاء
        document.getElementById('wordsSection').style.display = 'none';
        document.getElementById('finishBtn').style.display = 'none';

        zones.forEach(zone => {
            // إزالة القدرة على السحب مرة أخرى
            zone.removeEventListener('drop', handleDrop);
            zone.style.cursor = 'default';
            
            if (zone.innerText === zone.dataset.answer) {
                zone.classList.add('correct');
                correctCount++;
            } else {
                zone.classList.add('wrong');
                // إذا كان المربع فارغاً، نظهر الإجابة الصحيحة بخط صغير
                if(zone.innerText === "") {
                    zone.innerHTML = `<span style="opacity:0.7; font-size:9px;">(${zone.dataset.answer})</span>`;
                }
            }
        });

        const wrongCount = totalParts - correctCount;
        const resultPanel = document.getElementById('resultPanel');
        const resultText = document.getElementById('resultText');
        
        resultPanel.style.display = 'block';
        resultText.innerHTML = `
            تمت المراجعة! نتيجتك هي: <br>
            <span class="score-correct">${correctCount} صح</span> | 
            <span class="score-wrong">${wrongCount} خطأ</span> <br>
            <span style="font-size:0.8em; color:#7f8c8d;">الوقت المستغرق: ${seconds} ثانية</span>
        `;
        
        // التمرير للأسفل لرؤية النتيجة
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
  </html>
